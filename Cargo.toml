[package]
name = "ChronoTrack"
version = "0.0.1"
edition = "2024"
license = "MIT"
build = "build.rs"
description = "Tracking Timecards Made Easy"

[dependencies]
slint = "1.15.1"
serde_json = "1.0.149"
rfd = "0.17.2"
chrono = "0.4.44"

[build-dependencies]
slint-build = "1.10"

[package.metadata.slint]
# Ensure the Slint build output is usable across targets.
windows = true
linux = true
macos = true
